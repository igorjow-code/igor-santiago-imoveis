[build]
  command = "python3 build_site.py"
  publish = "publico"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/obrigado"
  to = "/obrigado.html"
  status = 200

[[headers]]
  for = "/obrigado.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/obrigado"
  [headers.values]
    X-Robots-Tag = "noindex"
